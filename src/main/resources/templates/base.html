<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
  Fragmentos comunes de Tribuna. Cada pagina los incluye con:
  <head th:replace="~{base :: head('Titulo')}"></head>
-->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Tribuna'">Tribuna</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/tribuna.css}" href="../static/css/tribuna.css" rel="stylesheet">
</head>
<body>
 
<!-- ===== Cabecera de la revista ===== -->
<header th:fragment="cabecera" class="cabecera">
    <div class="container cabecera-fila">
        <a class="cabecera-marca" th:href="@{/}">Tribuna</a>
        <nav class="cabecera-nav" aria-label="Principal">
            <a th:href="@{/clubes}" class="cabecera-enlace"
               th:classappend="${seccion == 'clubes'} ? 'activo'">Clubes</a>
            <a th:href="@{/asociaciones}" class="cabecera-enlace"
               th:classappend="${seccion == 'asociaciones'} ? 'activo'">Asociaciones</a>
            <a th:href="@{/competiciones}" class="cabecera-enlace"
               th:classappend="${seccion == 'competiciones'} ? 'activo'">Competiciones</a>
            <a th:href="@{/clubes/nuevo}" class="btn btn-azul">Registrar club</a>
        </nav>
    </div>
    <div class="franja-tricolor" aria-hidden="true"><span></span><span></span><span></span></div>
</header>
 
<!-- ===== Avisos ===== -->
<div th:fragment="avisos" class="container">
    <div th:if="${exito}" class="alert aviso-exito alert-dismissible fade show mt-4" role="status">
        <span th:text="${exito}">Guardado</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar aviso"></button>
    </div>
    <div th:if="${error}" class="alert aviso-error alert-dismissible fade show mt-4" role="alert">
        <span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar aviso"></button>
    </div>
</div>
 
<!-- ===== Pie ===== -->
<footer th:fragment="pie" class="pie">
    <div class="franja-tricolor" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="container pie-texto">
        <span class="pie-marca">Tribuna</span>
        <span>Clubes del Mundial</span>
    </div>
</footer>
 
<!-- ===== Scripts ===== -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
 
</body>
</html>
